# Push a tag like v0.2.0 to build every platform and attach one self-contained binary per platform to a GitHub release.
name: Release
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npx neu update
      - run: npm run build
      # mac_universal covers Intel and Apple Silicon, so the per-arch mac builds are left out
      - run: |
          cd release/smart-floor
          gh release create "$GITHUB_REF_NAME" smart-floor-linux_x64 smart-floor-linux_arm64 smart-floor-linux_armhf smart-floor-mac_universal smart-floor-win_x64.exe --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
